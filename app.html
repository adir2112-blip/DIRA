<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+CiAgPHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTIiIGZpbGw9IiMxQzFDMUUiLz4KICA8dGV4dCB4PSIzMiIgeT0iNDEiIGZvbnQtZmFtaWx5PSJHZW9yZ2lhLCBUaW1lcywgc2VyaWYiIGZvbnQtc2l6ZT0iMjQiIGZvbnQtd2VpZ2h0PSI3MDAiIGZpbGw9IiNDOUE4NEMiIHRleHQtYW5jaG9yPSJtaWRkbGUiPteZLteTPC90ZXh0Pgo8L3N2Zz4=">
<title>רכישת דירות י.ד בנגב</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1C1C1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="י.ד בנגב">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F5F0E8;
    --warm-white: #FDFAF5;
    --charcoal: #1C1C1E;
    --gold: #C9A84C;
    --gold-light: #E8CC7A;
    --brown: #6B4F3A;
    --muted: #8A8480;
    --section-bg: #F0EAE0;
    --danger: #B5453A;
    --success: #5A7A5A;
    --border: rgba(28,28,30,0.1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Heebo', sans-serif;
    background: var(--cream);
    color: var(--charcoal);
    direction: rtl;
    min-height: 100vh;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, textarea, select { font-family: inherit; }

  .hidden { display: none !important; }

  /* ===== shared bits ===== */
  .brand {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    color: var(--charcoal);
  }
  .eyebrow {
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    color: var(--gold);
    text-transform: uppercase;
    font-weight: 500;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
    padding: 0.85rem 1.4rem; border-radius: 10px; font-size: 0.95rem; font-weight: 500;
    transition: transform 0.15s, opacity 0.15s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-gold { background: var(--gold); color: var(--charcoal); font-weight: 700; }
  .btn-dark { background: var(--charcoal); color: var(--warm-white); }
  .btn-ghost { background: rgba(28,28,30,0.06); color: var(--charcoal); }
  .btn-danger { background: rgba(181,69,58,0.1); color: var(--danger); }
  .btn-block { width: 100%; }
  .btn:disabled { opacity: 0.5; pointer-events: none; }

  .card {
    background: var(--warm-white);
    border-radius: 16px;
    padding: 1.25rem;
    border: 1px solid var(--border);
  }

  .spinner {
    width: 22px; height: 22px; border-radius: 50%;
    border: 3px solid rgba(201,168,76,0.25); border-top-color: var(--gold);
    animation: spin 0.7s linear infinite; margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: var(--charcoal); color: var(--warm-white); padding: 0.8rem 1.4rem;
    border-radius: 10px; font-size: 0.9rem; z-index: 500; opacity: 0; pointer-events: none;
    transition: opacity 0.25s, bottom 0.25s; max-width: 90vw; text-align: center;
  }
  .toast.show { opacity: 1; bottom: 100px; }
  .toast.error { background: var(--danger); }

  /* ===== centered auth screens ===== */
  .auth-screen {
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2rem 1.5rem; position: relative;
    background:
      linear-gradient(160deg, rgba(28,20,16,0.88), rgba(15,15,16,0.94)),
      url('login-bg.jpg');
    background-size: cover;
    background-position: center;
  }
  .auth-box { width: 100%; max-width: 420px; }
  .auth-logo { text-align: center; margin-bottom: 2rem; }
  .auth-logo .icon { font-size: 2.2rem; margin-bottom: 0.4rem; }
  .auth-logo h1 { font-size: 1.5rem; color: var(--warm-white); }
  .auth-logo p { color: var(--muted); font-size: 0.85rem; margin-top: 0.3rem; }
  .auth-card { background: var(--warm-white); border-radius: 20px; padding: 1.75rem; }

  .name-grid { display: grid; gap: 0.7rem; margin-bottom: 0.5rem; }
  .name-btn {
    display: flex; align-items: center; gap: 0.8rem; padding: 1rem 1.1rem;
    background: var(--section-bg); border-radius: 12px; font-size: 1.05rem; font-weight: 500;
    text-align: right; transition: background 0.15s;
  }
  .name-btn:active { background: var(--gold-light); }
  .name-btn .av {
    width: 38px; height: 38px; border-radius: 50%; background: var(--gold); color: var(--charcoal);
    display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0;
  }

  .pin-dots { display: flex; justify-content: center; gap: 0.9rem; margin: 1.5rem 0; }
  .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--gold); transition: background 0.15s; }
  .pin-dot.filled { background: var(--gold); }
  .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.7rem; }
  .pin-key {
    aspect-ratio: 1; border-radius: 14px; background: var(--section-bg); font-size: 1.3rem; font-weight: 600;
    display: flex; align-items: center; justify-content: center; transition: background 0.1s;
  }
  .pin-key:active { background: var(--gold-light); }
  .pin-key.wide { font-size: 0.95rem; color: var(--muted); }
  .back-link { display: flex; align-items: center; gap: 0.3rem; color: var(--muted); font-size: 0.9rem; margin-bottom: 1rem; }

  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.4rem; font-weight: 500; }
  .field input, .field textarea, .field select {
    width: 100%; padding: 0.8rem 0.9rem; border-radius: 10px; border: 1.5px solid var(--border);
    background: var(--warm-white); font-size: 1rem; color: var(--charcoal);
  }
  .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--gold); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }

  /* ===== app shell ===== */
  #app-shell { min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 78px; }

  .top-bar {
    background: var(--charcoal); padding: 1rem 1.1rem 0.9rem; position: sticky; top: 0; z-index: 50;
  }
  .top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.9rem; gap: 0.5rem; }
  .top-greeting { color: var(--warm-white); font-size: 0.9rem; white-space: nowrap; }
  .top-greeting b { color: var(--gold-light); }
  .top-actions { display: flex; align-items: center; gap: 0.4rem; }
  .top-icon-btn {
    width: 30px; height: 30px; border-radius: 8px; background: rgba(255,255,255,0.08); color: var(--warm-white);
    font-size: 0.78rem; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .logout-btn { color: var(--muted); font-size: 0.82rem; text-decoration: underline; }

  .apt-switch { display: flex; gap: 0.5rem; background: rgba(255,255,255,0.06); padding: 0.3rem; border-radius: 12px; }
  .apt-tab {
    flex: 1; padding: 0.65rem 0.5rem; border-radius: 9px; color: var(--muted); font-size: 0.88rem; font-weight: 500;
    text-align: center; transition: background 0.2s, color 0.2s;
  }
  .apt-tab.active { background: var(--gold); color: var(--charcoal); font-weight: 700; }

  main { flex: 1; padding: 1.1rem; max-width: 640px; margin: 0 auto; width: 100%; }

  .view-title { font-family: 'Playfair Display', serif; font-size: 1.4rem; margin-bottom: 1rem; }

  /* overview */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin-bottom: 1.2rem; }
  .stat-card { background: var(--warm-white); border-radius: 14px; padding: 1rem; border: 1px solid var(--border); }
  .stat-card .n { font-size: 1.5rem; font-weight: 700; font-family: 'Playfair Display', serif; }
  .stat-card .l { font-size: 0.78rem; color: var(--muted); margin-top: 0.2rem; }
  .stat-card.wide { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; }

  .meter-track { height: 20px; border-radius: 999px; background: var(--section-bg); overflow: hidden; }
  .meter-fill { height: 100%; border-radius: 999px; background: var(--gold); transition: width 0.4s ease; }
  .bar-item { margin-bottom: 0.9rem; display: block; width: 100%; text-align: inherit; }
  .bar-item:last-child { margin-bottom: 0; }
  .bar-item-clickable { padding: 0.4rem; margin: -0.4rem -0.4rem 0.5rem; border-radius: 10px; transition: background 0.15s; }
  .bar-item-clickable:active { background: var(--section-bg); }
  .bar-header { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 0.35rem; }

  /* lists */
  .list { display: flex; flex-direction: column; gap: 0.7rem; }
  .item-card { background: var(--warm-white); border-radius: 14px; padding: 1rem; border: 1px solid var(--border); }
  .item-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.6rem; }
  .item-title { font-weight: 600; font-size: 1rem; }
  .item-title.done { text-decoration: line-through; color: var(--muted); }
  .item-desc { color: var(--muted); font-size: 0.85rem; margin-top: 0.25rem; line-height: 1.4; }
  .item-meta { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.6rem; }
  .check-row { display: flex; align-items: flex-start; gap: 0.7rem; }
  .checkbox {
    width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--gold); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; margin-top: 2px; transition: background 0.15s;
  }
  .checkbox.checked { background: var(--gold); }
  .checkbox.checked::after { content: '✓'; color: var(--charcoal); font-weight: 700; font-size: 0.95rem; }
  .due-badge {
    font-size: 0.75rem; font-weight: 700; padding: 0.28rem 0.6rem; border-radius: 999px;
    background: rgba(90,122,90,0.15); color: var(--success);
  }
  .due-badge.soon { background: rgba(201,168,76,0.2); color: #8a6d1a; }
  .due-badge.today, .due-badge.overdue { background: rgba(181,69,58,0.15); color: var(--danger); }
  .tag {
    font-size: 0.72rem; padding: 0.28rem 0.6rem; border-radius: 999px; background: var(--section-bg); color: var(--brown);
    font-weight: 500;
  }
  .tag.status-pending, .tag.status-idea { background: rgba(201,168,76,0.18); color: #8a6d1a; }
  .tag.status-agreed { background: rgba(107,79,58,0.15); color: var(--brown); }
  .tag.status-paid, .tag.status-done { background: rgba(90,122,90,0.18); color: var(--success); }
  .item-amount { font-weight: 700; font-size: 1.05rem; white-space: nowrap; }
  .item-actions { display: flex; gap: 0.4rem; }
  .icon-btn { width: 30px; height: 30px; border-radius: 8px; background: rgba(28,28,30,0.06); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }

  .cat-group { margin-bottom: 1.3rem; }
  .cat-group h3 { font-size: 0.95rem; color: var(--brown); }
  .cat-group-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.6rem; padding-right: 0.2rem; gap: 0.5rem; }

  .cat-accordion { margin-bottom: 0.6rem; border-radius: 14px; background: var(--warm-white); border: 1px solid var(--border); overflow: hidden; }
  .cat-accordion-header {
    display: flex; align-items: center; justify-content: space-between; padding: 0.9rem 1rem; cursor: pointer; gap: 0.6rem;
  }
  .cat-accordion-title { font-size: 0.95rem; font-weight: 600; color: var(--charcoal); display: flex; align-items: center; gap: 0.5rem; }
  .cat-count {
    font-size: 0.7rem; font-weight: 700; background: var(--section-bg); color: var(--brown);
    border-radius: 999px; padding: 0.1rem 0.5rem; min-width: 1.4rem; text-align: center;
  }
  .cat-accordion-right { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
  .accordion-arrow { color: var(--muted); font-size: 0.7rem; }
  .cat-accordion-body { padding: 0 1rem 1rem; border-top: 1px solid var(--border); }
  .cat-accordion-body .list { margin-top: 0.8rem; }
  .deadline-tag {
    font-size: 0.7rem; padding: 0.3rem 0.6rem; border-radius: 999px; background: var(--section-bg); color: var(--brown);
    white-space: nowrap; flex-shrink: 0;
  }
  .deadline-tag.overdue { background: rgba(181,69,58,0.15); color: var(--danger); }
  .suggest-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; }
  .suggest-chip {
    font-size: 0.75rem; padding: 0.4rem 0.7rem; border-radius: 999px; background: var(--section-bg); color: var(--brown);
    border: 1px solid var(--border);
  }
  .contact-row { display: flex; align-items: center; gap: 0.8rem; }
  .contact-avatar {
    width: 40px; height: 40px; border-radius: 50%; background: var(--section-bg); display: flex;
    align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0;
  }
  .more-card {
    display: flex; align-items: center; gap: 1rem; padding: 1.2rem; background: var(--warm-white);
    border-radius: 14px; border: 1px solid var(--border); margin-bottom: 0.8rem; text-align: right; width: 100%;
  }
  .more-card .ic { font-size: 1.6rem; }
  .more-card .txt b { display: block; font-size: 1rem; }
  .more-card .txt span { font-size: 0.8rem; color: var(--muted); }
  .back-row { display: flex; align-items: center; gap: 0.4rem; color: var(--muted); font-size: 0.9rem; margin-bottom: 0.9rem; }
  .plan-wrap { position: relative; cursor: crosshair; }
  .pin-marker {
    position: absolute; width: 26px; height: 26px; border-radius: 50%; background: var(--gold); color: var(--charcoal);
    font-size: 0.72rem; font-weight: 700; display: flex; align-items: center; justify-content: center;
    transform: translate(-50%, -50%); border: 2px solid var(--warm-white); box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }

  .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); }
  .empty-state .em { font-size: 2rem; margin-bottom: 0.6rem; }

  .filter-row { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.3rem; margin-bottom: 1rem; }
  .filter-chip { flex-shrink: 0; padding: 0.45rem 0.9rem; border-radius: 999px; background: var(--warm-white); border: 1px solid var(--border); font-size: 0.82rem; color: var(--muted); }
  .filter-chip.active { background: var(--charcoal); color: var(--warm-white); border-color: var(--charcoal); }

  /* documents grid */
  .doc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }
  .doc-tile { aspect-ratio: 1; border-radius: 12px; overflow: hidden; position: relative; background: var(--section-bg); }
  .doc-tile img { width: 100%; height: 100%; object-fit: cover; }
  .doc-tile .file-icon { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; }
  .doc-tile .doc-label { position: absolute; bottom: 0; inset-inline: 0; background: rgba(0,0,0,0.55); color: #fff; font-size: 0.65rem; padding: 0.25rem 0.4rem; }

  /* fab */
  .fab {
    position: fixed; bottom: 92px; left: 20px; width: 56px; height: 56px; border-radius: 50%;
    background: var(--gold); color: var(--charcoal); font-size: 1.6rem; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 20px rgba(201,168,76,0.4); z-index: 60;
  }

  /* bottom tabbar */
  .tabbar {
    position: fixed; bottom: 0; inset-inline: 0; background: var(--warm-white); border-top: 1px solid var(--border);
    display: flex; z-index: 70; padding-bottom: env(safe-area-inset-bottom);
  }
  .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.2rem; padding: 0.6rem 0.2rem 0.5rem; color: var(--muted); font-size: 0.68rem; }
  .tab-item .ic { font-size: 1.2rem; }
  .tab-item.active { color: var(--gold); font-weight: 600; }

  /* modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: flex-end;
  }
  .modal-sheet {
    background: var(--cream); width: 100%; max-height: 88vh; overflow-y: auto; border-radius: 20px 20px 0 0;
    padding: 1.3rem 1.2rem calc(1.5rem + env(safe-area-inset-bottom));
  }
  .modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 4px; margin: 0 auto 1rem; }
  .modal-title { font-family: 'Playfair Display', serif; font-size: 1.25rem; margin-bottom: 1.1rem; }
  .cat-picker { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; margin-bottom: 1rem; }
  .cat-pick-item { text-align: center; padding: 0.6rem 0.3rem; border-radius: 10px; background: var(--warm-white); border: 1.5px solid var(--border); font-size: 0.68rem; }
  .cat-pick-item .ic { font-size: 1.2rem; display: block; margin-bottom: 0.2rem; }
  .cat-pick-item.active { border-color: var(--gold); background: rgba(201,168,76,0.12); }
  .status-picker { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  .status-pick-item { flex: 1; text-align: center; padding: 0.6rem; border-radius: 10px; background: var(--warm-white); border: 1.5px solid var(--border); font-size: 0.82rem; }
  .status-pick-item.active { border-color: var(--gold); background: rgba(201,168,76,0.12); font-weight: 600; }
  .modal-actions { display: flex; gap: 0.6rem; margin-top: 1.2rem; }
  .file-drop {
    border: 1.5px dashed var(--border); border-radius: 12px; padding: 1.2rem; text-align: center; color: var(--muted);
    font-size: 0.85rem; margin-bottom: 1rem;
  }
  .preview-thumb { width: 100%; max-height: 160px; object-fit: contain; border-radius: 10px; margin-top: 0.6rem; }

  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 300; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; padding: 1rem; }
  .lightbox img { max-width: 100%; max-height: 75vh; border-radius: 8px; }
  .lightbox .lb-close { color: #fff; font-size: 1rem; padding: 0.6rem 1.2rem; background: rgba(255,255,255,0.15); border-radius: 999px; }

  .setup-step { margin-bottom: 1.3rem; }
  .setup-member-row { display: flex; gap: 0.6rem; margin-bottom: 0.6rem; align-items: center; }
  .setup-member-row input { flex: 1; }
  .pin-input { max-width: 110px !important; letter-spacing: 0.3em; text-align: center; }
</style>
</head>
<body>

<!-- ===== LOADING ===== -->
<div id="screen-loading" class="auth-screen">
  <div class="spinner"></div>
</div>

<!-- ===== SETUP (first run only) ===== -->
<section id="screen-setup" class="auth-screen hidden">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="icon">🏗️</div>
      <h1 class="brand">הקמה ראשונית</h1>
      <p>נעשה את זה פעם אחת בלבד — הגדירו את בני המשפחה ואת שתי הדירות</p>
    </div>
    <div class="auth-card">
      <div class="setup-step">
        <label style="font-size:0.85rem;color:var(--muted);font-weight:500;">בני המשפחה (שם + קוד בן 4 ספרות לכל אחד)</label>
        <div id="setupMembers" style="margin-top:0.6rem;"></div>
      </div>
      <div class="setup-step">
        <label style="font-size:0.85rem;color:var(--muted);font-weight:500;">שמות הדירות</label>
        <div class="field" style="margin-top:0.6rem;">
          <input type="text" id="setupApt1" placeholder="לדוגמה: הדירה שלי">
        </div>
        <div class="field">
          <input type="text" id="setupApt2" placeholder="לדוגמה: דירת ההורים">
        </div>
      </div>
      <button class="btn btn-gold btn-block" id="btnSetupSubmit">סיימו הקמה והתחברו</button>
      <p id="setupError" class="hidden" style="color:var(--danger);font-size:0.85rem;margin-top:0.8rem;text-align:center;"></p>
    </div>
  </div>
</section>

<!-- ===== LOGIN: pick name ===== -->
<section id="screen-login-name" class="auth-screen hidden">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="icon">🏠</div>
      <h1 class="brand">רכישת דירות גן י.ד בנגב</h1>
      <p>מי מתחבר?</p>
    </div>
    <div class="auth-card">
      <div class="name-grid" id="nameGrid"></div>
    </div>
  </div>

const FONT_SCALES = [15, 16, 18, 20, 22];
function applyFontScale(px) {
  document.documentElement.style.fontSize = px + 'px';

}
(function initFontScale() {
  const saved = parseInt(localStorage.getItem('dira_fontscale'), 10);

function bumpFontScale(dir) {
  const current = parseInt(localStorage.getItem('dira_fontscale'), 10) || 16;
  const idx = FONT_SCALES.indexOf(current);
  const nextIdx = Math.max(0, Math.min(FONT_SCALES.length - 1, idx + dir));

}

// ===================== BOOTSTRAP / AUTH =====================
async function bootstrap() {
  showScreen('screen-loading');

  let { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    const { error } = await supabase.auth.signInAnonymously();
    if (error) { toast('שגיאת חיבור: ' + error.message, true); return; }
  }

  const { data: setupDone, error: setupErr } = await supabase.rpc('is_setup_done');
  if (setupErr) { toast('שגיאת חיבור לשרת', true); console.error(setupErr); return; }

  if (!setupDone) {
    renderSetupScreen();
    showScreen('screen-setup');
    return;
  }

  // try to resume existing session
  const cached = JSON.parse(localStorage.getItem('dira_member') || 'null');
  const { data: sessRow } = await supabase.from('sessions').select('member_id, expires_at').maybeSingle();

  if (sessRow && new Date(sessRow.expires_at) > new Date() && cached && cached.id === sessRow.member_id) {
    state.member = cached;
    await supabase.rpc('touch_session');
    await enterApp();
    return;
  }

  localStorage.removeItem('dira_member');
  await renderLoginNameScreen();
  showScreen('screen-login-name');
}

function updatePinDots() {

function renderPinPad() {
  const pad = $('#pinPad');
  pad.innerHTML = '';
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  keys.forEach(k => {
    const key = el('button', 'pin-key' + (k === '⌫' ? ' wide' : ''), k);
    if (k === '') { key.style.visibility = 'hidden'; }
    else {
      key.addEventListener('click', () => onPinKey(k));
    }
    pad.appendChild(key);
  });
}
async function onPinKey(k) {
  if (k === '⌫') { currentPin = currentPin.slice(0, -1); updatePinDots(); return; }
  if (currentPin.length >= 4) return;
  currentPin += k;
  updatePinDots();
  if (currentPin.length === 4) await submitLogin();
}

document.addEventListener('keydown', (e) => {
  if ($('#screen-login-pin').classList.contains('hidden')) return;
  if (/^[0-9]$/.test(e.key)) { onPinKey(e.key); }
  else if (e.key === 'Backspace') { onPinKey('⌫'); }
});
async function submitLogin() {
  const { data, error } = await supabase.rpc('login_with_pin', { p_full_name: selectedLoginName, p_id_last4: currentPin });

async function enterApp() {

const REALTIME_LABELS = {
  expenses: row => `הוסיפו עלות: ${row.description}`,
  tasks: row => `הוסיפו משימה: ${row.title}`,
  documents: row => `העלו קובץ: ${row.title || row.file_name}`,
  contacts: row => `הוסיפו איש קשר: ${row.name}`,
  furniture_items: row => `הוסיפו פריט: ${row.title}`,
  quotes: row => `הוסיפו הצעת מחיר: ${row.supplier_name}`,
};

function handleRealtimeEvent(table, payload) {
  if (payload.eventType === 'INSERT') {
    const row = payload.new;
    const byId = row.added_by_member_id || row.uploaded_by_member_id;
    if (row.apartment_id === state.currentApartmentId && byId && byId !== state.member.id) {
      const name = state.memberNames[byId] || 'מישהו';
      const labelFn = REALTIME_LABELS[table];
      if (labelFn) toast(`${name} ${labelFn(row)}`);
    }
  }
  refreshCurrentApartmentData();
}

function setupRealtime() {
  if (state.realtimeChannel) supabase.removeChannel(state.realtimeChannel);
  state.realtimeChannel = supabase
    .channel('dira-updates')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'expenses' }, (p) => handleRealtimeEvent('expenses', p))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, (p) => handleRealtimeEvent('tasks', p))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'documents' }, (p) => handleRealtimeEvent('documents', p))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'contacts' }, (p) => handleRealtimeEvent('contacts', p))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'furniture_items' }, (p) => handleRealtimeEvent('furniture_items', p))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'category_deadlines' }, (p) => handleRealtimeEvent('category_deadlines', p))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'floor_plans' }, (p) => handleRealtimeEvent('floor_plans', p))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'plan_pins' }, (p) => handleRealtimeEvent('plan_pins', p))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'quotes' }, (p) => handleRealtimeEvent('quotes', p))
    .subscribe();
}

let refreshTimer = null;
function refreshCurrentApartmentData() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(async () => { await loadAllData(); renderCurrentView(); }, 350);
}

async function loadAllData() {
  const aptId = state.currentApartmentId;
  const [expRes, taskRes, docRes, contactRes, furnRes, deadlineRes, planRes, pinRes, quoteRes] = await Promise.all([
    supabase.from('expenses').select('*').eq('apartment_id', aptId).eq('is_deleted', false).order('expense_date', { ascending: false }),
    supabase.from('tasks').select('*').eq('apartment_id', aptId).order('created_at', { ascending: false }),
    supabase.from('documents').select('*').eq('apartment_id', aptId).order('created_at', { ascending: false }),
    supabase.from('contacts').select('*').eq('apartment_id', aptId).order('created_at', { ascending: false }),
    supabase.from('furniture_items').select('*').eq('apartment_id', aptId).order('created_at', { ascending: false }),
    supabase.from('category_deadlines').select('*').eq('apartment_id', aptId),
    supabase.from('floor_plans').select('*').eq('apartment_id', aptId).maybeSingle(),
    supabase.from('plan_pins').select('*').eq('apartment_id', aptId).order('created_at', { ascending: true }),
    supabase.from('quotes').select('*').eq('apartment_id', aptId).order('price', { ascending: true }),
  ]);
  state.expenses = expRes.data || [];
  state.tasks = taskRes.data || [];
  state.documents = docRes.data || [];
  state.contacts = contactRes.data || [];
  state.furnitureItems = furnRes.data || [];
  state.categoryDeadlines = deadlineRes.data || [];
  state.floorPlan = planRes.data || null;
  state.planPins = pinRes.data || [];
  state.quotes = quoteRes.data || [];
}

function renderCurrentView() {
  const fab = $('#fabAdd');
  if (state.currentView === 'overview') { renderOverview(); fab.classList.add('hidden'); }
  if (state.currentView === 'costs') { renderCosts(); fab.classList.remove('hidden'); fab.onclick = () => openExpenseModal(); }
  if (state.currentView === 'tasks') { renderTasks(); fab.classList.add('hidden'); }
  if (state.currentView === 'documents') { renderDocuments(); fab.classList.remove('hidden'); fab.onclick = () => openDocumentModal(); }
  if (state.currentView === 'more') { renderMoreMenu(); fab.classList.add('hidden'); }
  if (state.currentView === 'contacts') { renderContacts(); fab.classList.remove('hidden'); fab.onclick = () => openContactModal(); }
  if (state.currentView === 'furniture') { renderFurniture(); fab.classList.remove('hidden'); fab.onclick = () => openFurnitureModal(); }
  if (state.currentView === 'floorplan') { renderFloorPlan(); fab.classList.add('hidden'); }
  if (state.currentView === 'quotes') { renderQuotes(); fab.classList.remove('hidden'); fab.onclick = () => openQuoteModal(); }
}

function renderOverview() {
  const v = $('#view-overview');
  const totalPaid = state.expenses.filter(e => e.status === 'paid').reduce((s, e) => s + Number(e.amount), 0);
  const totalPending = state.expenses.filter(e => e.status === 'pending').reduce((s, e) => s + Number(e.amount), 0);
  const openTasks = state.tasks.filter(t => t.status !== 'done').length;
  const doneTasks = state.tasks.filter(t => t.status === 'done').length;
  const totalTasks = state.tasks.length;
  const donePct = totalTasks === 0 ? 0 : Math.round((doneTasks / totalTasks) * 100);

  const byCategory = CATEGORIES
    .map(c => ({ ...c, amount: state.expenses.filter(e => e.category === c.id).reduce((s, e) => s + Number(e.amount), 0) }))
    .filter(c => c.amount > 0)
    .sort((a, b) => b.amount - a.amount);
  const maxAmount = byCategory.length ? byCategory[0].amount : 0;

function openCategoryExpensesModal(cat) {
  const items = state.expenses.filter(e => e.category === cat.id).sort((a, b) => Number(b.amount) - Number(a.amount));
  const total = items.reduce((s, e) => s + Number(e.amount), 0);
  const rows = items.map(e => `
    <div class="item-card">
      <div class="item-top">
        <div>
          <div class="item-title">${escapeHtml(e.description)}</div>
          ${e.notes ? `<div class="item-desc">${escapeHtml(e.notes)}</div>` : ''}
          <div class="item-desc">${fmtDate(e.expense_date)}</div>
        </div>
        <div class="item-amount">${fmtMoney(e.amount)}</div>
      </div>
      <div class="item-meta"><span class="tag status-${e.status}">${EXPENSE_STATUSES.find(s => s.id === e.status).label}</span></div>
    </div>
  `).join('');
  openModal(`
    <div class="modal-title">${cat.icon} ${cat.label}</div>
    <div class="list">${rows}</div>
    <div class="stat-card wide" style="margin-top:0.9rem;"><span>סה"כ</span><span class="item-amount">${fmtMoney(total)}</span></div>
    <div class="modal-actions"><button class="btn btn-ghost btn-block" id="mCancel">סגירה</button></div>
  `);
  $('#mCancel').addEventListener('click', closeModal);
}

function fmtMoney(n) { return '₪' + Number(n).toLocaleString('he-IL', { maximumFractionDigits: 0 }); }
function fmtDate(d) { return new Date(d).toLocaleDateString('he-IL'); }

function daysUntilLabel(dueDateStr) {
  const due = new Date(dueDateStr + 'T00:00:00');
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  const diff = Math.round((due - now) / 86400000);
  if (diff === 0) return { label: 'היום!', cls: 'today' };
  if (diff === 1) return { label: 'מחר', cls: 'soon' };
  if (diff > 1) return { label: `עוד ${diff} ימים`, cls: diff <= 3 ? 'soon' : '' };
  return { label: `באיחור ${Math.abs(diff)} ימים`, cls: 'overdue' };
}

// ===================== TASKS =====================
let taskFilter = 'all';
let expandedTaskCats = new Set();
const TASK_FILTERS = [{ id: 'open', label: 'פתוח' }, { id: 'done', label: 'בוצע' }, { id: 'all', label: 'הכל' }];

function renderTasks() {
  const v = $('#view-tasks');
  v.innerHTML = `
    <h2 class="view-title">צ'ק ליסט — שינוי דיירים</h2>
    <div class="filter-row" id="taskFilterRow"></div>
    <div id="taskGroups"></div>
    <div class="stat-card wide" id="taskCostTotal" style="margin-top:0.9rem;"></div>
  `;
  const row = $('#taskFilterRow');
  TASK_FILTERS.forEach(f => {
    const chip = el('button', 'filter-chip' + (taskFilter === f.id ? ' active' : ''), f.label);
    chip.addEventListener('click', () => { taskFilter = f.id; renderTasks(); });
    row.appendChild(chip);
  });

  const filtered = state.tasks.filter(t => {
    if (taskFilter === 'open') return t.status !== 'done';
    if (taskFilter === 'done') return t.status === 'done';
    return true;
  });

  const costTotal = filtered.reduce((s, t) => s + (t.cost ? Number(t.cost) : 0), 0);
  $('#taskCostTotal').innerHTML = `<span>סה"כ עלות שינויים</span><span class="item-amount">${fmtMoney(costTotal)}</span>`;

  const groupsWrap = $('#taskGroups');
  groupsWrap.innerHTML = '';
  const today = new Date().toISOString().slice(0, 10);

  CATEGORIES.forEach(cat => {
    const items = filtered.filter(t => t.category === cat.id).sort((a, b) => {
      if (!a.due_date && !b.due_date) return 0;
      if (!a.due_date) return 1;
      if (!b.due_date) return -1;
      return a.due_date.localeCompare(b.due_date);
    });
    const isOpen = expandedTaskCats.has(cat.id);
    const deadline = state.categoryDeadlines.find(d => d.category === cat.id);
    const deadlinePast = deadline && deadline.deadline < today;

    const group = el('div', 'cat-accordion');
    group.innerHTML = `
      <div class="cat-accordion-header">
        <span class="cat-accordion-title">${cat.icon} ${cat.label} <span class="cat-count">${items.length}</span></span>
        <div class="cat-accordion-right">
          <button class="deadline-tag${deadlinePast ? ' overdue' : ''}" id="deadline-${cat.id}">
            ${deadline ? `🔒 עד ${fmtDate(deadline.deadline)}` : '🔒 דדליין'}
          </button>
          <span class="accordion-arrow">${isOpen ? '▲' : '▼'}</span>
        </div>
      </div>
      <div class="cat-accordion-body ${isOpen ? '' : 'hidden'}">
        <div class="list" id="list-${cat.id}"></div>
        <button class="btn btn-ghost btn-block add-in-cat" style="margin-top:0.7rem;">+ הוספת פריט ל${cat.label}</button>
      </div>
    `;

    group.querySelector('.cat-accordion-header').addEventListener('click', (e) => {
      if (e.target.closest('.deadline-tag')) return;
      if (isOpen) expandedTaskCats.delete(cat.id); else expandedTaskCats.add(cat.id);
      renderTasks();
    });
    group.querySelector('.deadline-tag').addEventListener('click', (e) => { e.stopPropagation(); openDeadlineModal(cat, deadline); });
    group.querySelector('.add-in-cat').addEventListener('click', () => openTaskModal(null, cat.id));

    if (isOpen) {
      const list = group.querySelector('#list-' + cat.id);
      if (items.length === 0) {
        list.innerHTML = `<div class="empty-state" style="padding:1.5rem;"><div class="em">📋</div>אין עדיין פריטים בקטגוריה הזו</div>`;
      }
      items.forEach(t => {
        const isDone = t.status === 'done';
        const overdue = t.due_date && !isDone && t.due_date < today;
        const daysInfo = (t.due_date && !isDone) ? daysUntilLabel(t.due_date) : null;
        const card = el('div', 'item-card');
        card.innerHTML = `
          <div class="check-row">
            <button class="checkbox${isDone ? ' checked' : ''}" aria-label="בוצע"></button>
            <div style="flex:1;">
              <div class="item-title${isDone ? ' done' : ''}">${escapeHtml(t.title)}</div>
              ${t.description ? `<div class="item-desc">${escapeHtml(t.description)}</div>` : ''}
              <div class="item-meta">
                ${t.due_date ? `<span class="tag${overdue ? ' status-pending' : ''}">📅 ${fmtDate(t.due_date)}</span>` : ''}
                ${daysInfo ? `<span class="due-badge ${daysInfo.cls}">${daysInfo.label}</span>` : ''}
                ${t.cost != null ? `<span class="tag">💰 ${fmtMoney(t.cost)}</span>` : ''}
              </div>
            </div>
            <div class="item-actions">
              <button class="icon-btn btn-edit">✏️</button>
              <button class="icon-btn btn-del">🗑️</button>
            </div>
          </div>
        `;
        card.querySelector('.checkbox').addEventListener('click', () => toggleTaskDone(t));
        card.querySelector('.btn-edit').addEventListener('click', () => openTaskModal(t));
        card.querySelector('.btn-del').addEventListener('click', () => deleteTask(t.id));
        list.appendChild(card);
      });
    }
    groupsWrap.appendChild(group);
  });
}

function openDeadlineModal(cat, existing) {
  openModal(`
    <div class="modal-title">${cat.icon} דדליין לקטגוריה: ${cat.label}</div>
    <div class="field"><label>עד מתי אפשר עדיין לבקש שינויים בתחום הזה?</label><input type="date" id="mDeadline" value="${existing ? existing.deadline : ''}"></div>
    <div class="modal-actions">
      ${existing ? '<button class="btn btn-danger btn-block" id="mClear">מחיקה</button>' : ''}
      <button class="btn btn-ghost btn-block" id="mCancel">ביטול</button>
      <button class="btn btn-gold btn-block" id="mSave">שמירה</button>
    </div>
  `);
  $('#mCancel').addEventListener('click', closeModal);
  if (existing) {
    $('#mClear').addEventListener('click', async () => {
      await supabase.from('category_deadlines').delete().eq('id', existing.id);
      closeModal();
      await loadAllData(); renderCurrentView(); toast('הדדליין הוסר');
    });
  }
  $('#mSave').addEventListener('click', async () => {
    const val = $('#mDeadline').value;
    if (!val) { toast('נא לבחור תאריך', true); return; }
    const { error } = await supabase.from('category_deadlines').upsert({
      apartment_id: state.currentApartmentId, category: cat.id, deadline: val,
    }, { onConflict: 'apartment_id,category' });
    if (error) { toast('שגיאה בשמירה', true); return; }
    closeModal();
    await loadAllData(); renderCurrentView(); toast('נשמר בהצלחה');
  });
}

async function toggleTaskDone(t) {
  const nowDone = t.status !== 'done';
  const { error } = await supabase.from('tasks').update({
    status: nowDone ? 'done' : 'idea',
    resolved_at: nowDone ? new Date().toISOString() : null,
  }).eq('id', t.id);
  if (error) { toast('שגיאה בעדכון', true); return; }
  await loadAllData(); renderCurrentView();
}

async function deleteTask(id) {
  if (!confirm('למחוק את המשימה?')) return;
  const { error } = await supabase.from('tasks').delete().eq('id', id);
  if (error) { toast('שגיאה במחיקה', true); return; }
  await loadAllData(); renderCurrentView(); toast('נמחק');
}

  const isEdit = !!existing;
  const modal = openModal(`
    <div class="modal-title">${isEdit ? 'עריכת משימה' : 'משימה חדשה'}</div>

    <div class="suggest-row" id="mSuggestRow"></div>

  function renderSuggestRow() {
    const row = $('#mSuggestRow');

    (SUGGESTED_ITEMS[selCat] || []).forEach(s => {
      const chip = el('button', 'suggest-chip', s);
      chip.addEventListener('click', () => { $('#mTitle').value = s; });

// ===================== DOCUMENTS =====================
function renderDocuments() {
  const v = $('#view-documents');
  v.innerHTML = `
    <h2 class="view-title">מסמכים ותמונות</h2>
    <div class="doc-grid" id="docGrid"></div>
  `;
  const grid = $('#docGrid');
  if (state.documents.length === 0) {
    grid.outerHTML = `<div class="empty-state"><div class="em">📎</div>אין עדיין קבצים</div>`;
    return;
  }
  state.documents.forEach(d => {
    const tile = el('div', 'doc-tile');
    const isImage = (d.mime_type || '').startsWith('image/');
    tile.innerHTML = isImage
      ? `<img loading="lazy" data-path="${d.storage_path}"><div class="doc-label">${d.kind === 'receipt' ? '🧾' : '📄'} ${escapeHtml(d.title || d.file_name)}</div>`
      : `<div class="file-icon">📄</div><div class="doc-label">${escapeHtml(d.title || d.file_name)}</div>`;
    tile.addEventListener('click', () => openLightbox(d));
    grid.appendChild(tile);
    if (isImage) loadSignedThumb(tile.querySelector('img'), d.storage_path);
  });
}

async function loadSignedThumb(imgEl, path) {
  const { data } = await supabase.storage.from('attachments').createSignedUrl(path, 3600);
  if (data?.signedUrl) imgEl.src = data.signedUrl;
}

async function openLightbox(doc) {
  const { data, error } = await supabase.storage.from('attachments').createSignedUrl(doc.storage_path, 3600);
  const box = el('div', 'lightbox');
  const isImage = (doc.mime_type || '').startsWith('image/');
  box.innerHTML = `
    ${isImage && data ? `<img src="${data.signedUrl}">` : `<div style="color:#fff;">📄 ${escapeHtml(doc.file_name)}</div>`}
    <div style="display:flex;gap:0.6rem;">
      ${data ? `<a href="${data.signedUrl}" target="_blank" class="lb-close" style="text-decoration:none;">פתיחה / הורדה</a>` : ''}
      <button class="lb-close btn-del-doc">מחיקה</button>
      <button class="lb-close">סגירה</button>
    </div>
  `;
  box.querySelectorAll('.lb-close')[box.querySelectorAll('.lb-close').length - 1].addEventListener('click', () => box.remove());
  box.querySelector('.btn-del-doc').addEventListener('click', async () => {
    if (!confirm('למחוק את הקובץ?')) return;
    await supabase.storage.from('attachments').remove([doc.storage_path]);
    await supabase.from('documents').delete().eq('id', doc.id);
    box.remove();
    await loadAllData(); renderCurrentView(); toast('נמחק');
  });
  document.body.appendChild(box);
}

    <div class="file-drop">
      <input type="file" id="mFile" accept="image/*,application/pdf" style="width:100%;">

    <img id="mPreview" class="preview-thumb hidden">
    <div class="modal-actions">
      <button class="btn btn-ghost btn-block" id="mCancel">ביטול</button>
      <button class="btn btn-gold btn-block" id="mUpload">העלאה</button>

  renderStatusPicker($('#mKindPicker'), [{ id: 'receipt', label: '🧾 קבלה' }, { id: 'document', label: '📄 מסמך/שרטוט' }], selKind, k => selKind = k);

  $('#mFile').addEventListener('change', e => {
    const f = e.target.files[0];
    if (f && f.type.startsWith('image/')) {
      $('#mPreview').src = URL.createObjectURL(f);
      $('#mPreview').classList.remove('hidden');
    } else {
      $('#mPreview').classList.add('hidden');
    }
  });

  $('#mCancel').addEventListener('click', closeModal);
  $('#mUpload').addEventListener('click', async () => {
    const file = $('#mFile').files[0];
    if (!file) { toast('נא לבחור קובץ', true); return; }
    const title = $('#mDocTitle').value.trim();
    const btn = $('#mUpload');
    btn.disabled = true; btn.textContent = 'מעלה...';

    const path = `${state.currentApartmentId}/${selKind}/${crypto.randomUUID()}${safeFileExt(file)}`;
    const { error: upErr } = await supabase.storage.from('attachments').upload(path, file);
    if (upErr) { toast('שגיאה בהעלאה', true); btn.disabled = false; btn.textContent = 'העלאה'; return; }

    const { error: dbErr } = await supabase.from('documents').insert({
      apartment_id: state.currentApartmentId,
      kind: selKind,
      title: title || null,
      storage_path: path,
      file_name: file.name,
      mime_type: file.type,
      size_bytes: file.size,
      uploaded_by_member_id: state.member.id,
    });
    if (dbErr) { toast('שגיאה בשמירת הקובץ', true); btn.disabled = false; btn.textContent = 'העלאה'; return; }

    closeModal();
    await loadAllData(); renderCurrentView(); toast('הועלה בהצלחה');
  });
}

async function exportAllData() {
  toast('מכין קובץ...');
  const XLSX = await import('https://esm.sh/xlsx@0.18.5');

  const wb = XLSX.utils.book_new();
  const addSheet = (rows, name) => {
    const sheet = XLSX.utils.json_to_sheet(rows.length ? rows : [{ 'אין נתונים': '' }]);
    XLSX.utils.book_append_sheet(wb, sheet, name);
  };

  addSheet(state.expenses.map(e => ({
    'תיאור': e.description, 'קטגוריה': catLabel(e.category), 'סכום': Number(e.amount),
    'סטטוס': e.status === 'paid' ? 'שולם' : 'ממתין לתשלום', 'תאריך': e.expense_date, 'הערות': e.notes || '',
  })), 'עלויות');

  addSheet(state.tasks.map(t => ({
    'כותרת': t.title, 'קטגוריה': catLabel(t.category), 'סטטוס': t.status === 'done' ? 'בוצע' : 'פתוח',
    'תאריך יעד': t.due_date || '', 'עלות': t.cost != null ? Number(t.cost) : '', 'פירוט': t.description || '',
  })), 'משימות');

  addSheet(state.contacts.map(c => ({
    'שם': c.name, 'תחום': contactCatLabel(c.category), 'טלפון': c.phone || '', 'הערות': c.notes || '',
  })), 'אנשי קשר');

  addSheet(state.furnitureItems.map(f => ({
    'פריט': f.title, 'קטגוריה': furnCatLabel(f.category), 'חנות': f.store || '',
    'מחיר': f.price != null ? Number(f.price) : '', 'נרכש': f.purchased ? 'כן' : 'לא', 'תוקף אחריות': f.warranty_until || '',
  })), 'ריהוט וציוד');

  addSheet(state.quotes.map(q => ({
    'ספק': q.supplier_name, 'קטגוריה': catLabel(q.category), 'מחיר': q.price != null ? Number(q.price) : '',
    'נבחר כזוכה': q.is_selected ? 'כן' : 'לא', 'הערות': q.notes || '',
  })), 'הצעות מחיר');

  const aptName = state.apartments.find(a => a.id === state.currentApartmentId)?.display_name || 'דירה';
  XLSX.writeFile(wb, `${aptName} - גיבוי.xlsx`);
}

function openAddFamilyModal() {
  openModal(`
    <div class="modal-title">➕ משפחה / דירה חדשה</div>
    <p style="color:var(--muted);font-size:0.85rem;margin-bottom:0.9rem;">המשפחה החדשה תקבל מרחב נפרד לגמרי — היא תראה רק את הדירה הזו, ולא את הדירות הקיימות.</p>
    <div class="field"><label>שם הדירה / המשפחה</label><input type="text" id="mFamAptName" placeholder="לדוגמה: משפחת כהן"></div>
    <label style="font-size:0.8rem;color:var(--muted);font-weight:500;">בני המשפחה (שם + קוד בן 4 ספרות לכל אחד)</label>
    <div id="famMembers" style="margin:0.6rem 0;"></div>
    <button class="btn btn-ghost btn-block" id="famAddRow" style="margin-bottom:1rem;">+ הוספת בן משפחה</button>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-block" id="mCancel">ביטול</button>
      <button class="btn btn-gold btn-block" id="mSave">יצירה</button>
    </div>
    <p id="famError" class="hidden" style="color:var(--danger);font-size:0.85rem;margin-top:0.8rem;text-align:center;"></p>
  `);

  const wrap = $('#famMembers');
  function addFamRow() {
    const row = el('div', 'setup-member-row');
    row.innerHTML = `<input type="text" placeholder="שם" class="fam-name"><input type="tel" inputmode="numeric" maxlength="4" placeholder="4 ספרות" class="pin-input fam-pin">`;
    wrap.appendChild(row);
  }
  addFamRow();
  $('#famAddRow').addEventListener('click', addFamRow);
  $('#mCancel').addEventListener('click', closeModal);

  $('#mSave').addEventListener('click', async () => {
    const errEl = $('#famError');
    errEl.classList.add('hidden');
    const aptName = $('#mFamAptName').value.trim();
    const rows = [...document.querySelectorAll('#famMembers .setup-member-row')];
    const members = rows.map(r => ({
      full_name: r.querySelector('.fam-name').value.trim(),
      pin: r.querySelector('.fam-pin').value.trim(),
    }));

    if (!aptName) { errEl.textContent = 'נא למלא שם דירה'; errEl.classList.remove('hidden'); return; }
    for (const m of members) {
      if (!m.full_name) { errEl.textContent = 'נא למלא שם לכל בני המשפחה'; errEl.classList.remove('hidden'); return; }
      if (!/^\d{4}$/.test(m.pin)) { errEl.textContent = `נא להזין קוד בן 4 ספרות עבור ${m.full_name}`; errEl.classList.remove('hidden'); return; }
    }

    const btn = $('#mSave');
    btn.disabled = true; btn.textContent = 'יוצר...';
    const { error } = await supabase.rpc('add_family', { p_apartment_name: aptName, p_members: members });
    btn.disabled = false; btn.textContent = 'יצירה';

    if (error) { errEl.textContent = error.message || 'שגיאה ביצירה'; errEl.classList.remove('hidden'); return; }
    closeModal();
    toast('המשפחה נוצרה! הם יכולים להתחבר עכשיו עם השם והקוד שלהם');
  });
}

  v.innerHTML = `
    <button class="back-row" id="backToMore">→ עוד</button>
    <h2 class="view-title">שרטוט הדירה</h2>
  `;
  $('#backToMore').addEventListener('click', () => switchView('more'));

      <input type="file" id="planFile" accept="image/*" style="width:100%;margin-bottom:0.8rem;">
      <button class="btn btn-gold btn-block" id="planUploadBtn">העלאת שרטוט</button>
    `;
    v.appendChild(box);
    $('#planUploadBtn').addEventListener('click', uploadFloorPlan);
    return;
  }

  const wrap = el('div', 'card');
  wrap.innerHTML = `
    <p style="color:var(--muted);font-size:0.85rem;margin-bottom:0.7rem;">לחצו על השרטוט כדי להוסיף נקודה. לחצו על נקודה קיימת לעריכה.</p>

      <img id="planImg" style="width:100%;display:block;border-radius:10px;">
    </div>
    <button class="btn btn-ghost btn-block" id="planReplaceBtn" style="margin-top:0.9rem;">🔄 החלפת שרטוט</button>
  `;
  v.appendChild(wrap);
  $('#planReplaceBtn').addEventListener('click', () => { state.floorPlan = null; renderFloorPlan(); });

  const img = $('#planImg');
  supabase.storage.from('attachments').createSignedUrl(state.floorPlan.storage_path, 3600).then(({ data }) => {
    if (data?.signedUrl) img.src = data.signedUrl;
  });

  const planWrap = $('#planWrap');
  planWrap.addEventListener('click', (e) => {
    if (e.target.closest('.pin-marker')) return;
    const rect = img.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    openPinModal(x, y);
  });

  state.planPins.forEach((pin, i) => {
    const marker = el('button', 'pin-marker', String(i + 1));
    marker.style.left = pin.x + '%';
    marker.style.top = pin.y + '%';
    marker.addEventListener('click', (e) => { e.stopPropagation(); openPinModal(null, null, pin); });
    planWrap.appendChild(marker);
  });
}

async function uploadFloorPlan() {
  const file = $('#planFile').files[0];
  if (!file) { toast('נא לבחור תמונה', true); return; }
  const btn = $('#planUploadBtn');
  btn.disabled = true; btn.textContent = 'מעלה...';

  const path = `${state.currentApartmentId}/floorplan/${crypto.randomUUID()}${safeFileExt(file)}`;
  const { error: upErr } = await supabase.storage.from('attachments').upload(path, file);
  if (upErr) { toast('שגיאה בהעלאה', true); btn.disabled = false; btn.textContent = 'העלאת שרטוט'; return; }

  const { error } = await supabase.from('floor_plans').upsert({
    apartment_id: state.currentApartmentId, storage_path: path, updated_at: new Date().toISOString(),
  }, { onConflict: 'apartment_id' });
  if (error) { toast('שגיאה בשמירה', true); btn.disabled = false; btn.textContent = 'העלאת שרטוט'; return; }

  await loadAllData(); renderCurrentView(); toast('השרטוט הועלה בהצלחה');
}

function openPinModal(x, y, existing) {
  const isEdit = !!existing;
  const taskOptions = state.tasks.map(t => `<option value="${t.id}" ${existing?.linked_task_id === t.id ? 'selected' : ''}>${escapeHtml(t.title)}</option>`).join('');
  openModal(`
    <div class="modal-title">${isEdit ? 'עריכת נקודה' : 'נקודה חדשה'}</div>
    <div class="field"><label>תווית קצרה</label><input type="text" id="mPinLabel" value="${isEdit ? escapeHtml(existing.label) : ''}" placeholder="לדוגמה: נקודת מים"></div>
    <div class="field"><label>קישור למשימה (אופציונלי)</label>
      <select id="mPinTask"><option value="">ללא קישור</option>${taskOptions}</select>
    </div>
    <div class="modal-actions">
      ${isEdit ? '<button class="btn btn-danger btn-block" id="mDeletePin">מחיקה</button>' : ''}
      <button class="btn btn-ghost btn-block" id="mCancel">ביטול</button>
      <button class="btn btn-gold btn-block" id="mSave">שמירה</button>
    </div>
  `);

  $('#mCancel').addEventListener('click', closeModal);
  if (isEdit) {
    $('#mDeletePin').addEventListener('click', async () => {
      if (!confirm('למחוק את הנקודה?')) return;
      await supabase.from('plan_pins').delete().eq('id', existing.id);
      closeModal();
      await loadAllData(); renderCurrentView(); toast('הנקודה נמחקה');
    });
  }
  $('#mSave').addEventListener('click', async () => {
    const label = $('#mPinLabel').value.trim();
    const linkedTaskId = $('#mPinTask').value || null;
    if (!label) { toast('נא למלא תווית', true); return; }

    let error;
    if (isEdit) {
      ({ error } = await supabase.from('plan_pins').update({ label, linked_task_id: linkedTaskId }).eq('id', existing.id));
    } else {
      ({ error } = await supabase.from('plan_pins').insert({
        apartment_id: state.currentApartmentId, x, y, label, linked_task_id: linkedTaskId, added_by_member_id: state.member.id,
      }));
    }
    if (error) { toast('שגיאה בשמירה', true); return; }
    closeModal();
    await loadAllData(); renderCurrentView(); toast('נשמר בהצלחה');
  });
}

// ===================== QUOTES =====================
function renderQuotes() {
  const v = $('#view-quotes');
  v.innerHTML = `
    <button class="back-row" id="backToMore">→ עוד</button>
    <h2 class="view-title">השוואת הצעות מחיר</h2>
    <div id="quoteGroups"></div>
  `;
  $('#backToMore').addEventListener('click', () => switchView('more'));

  const wrap = $('#quoteGroups');
  if (state.quotes.length === 0) {
    wrap.innerHTML = `<div class="empty-state"><div class="em">📊</div>אין עדיין הצעות מחיר</div>`;
    return;
  }
  CATEGORIES.forEach(cat => {
    const items = state.quotes.filter(q => q.category === cat.id);
    if (items.length === 0) return;
    const group = el('div', 'cat-group');
    group.innerHTML = `<h3>${cat.icon} ${cat.label}</h3>`;
    const list = el('div', 'list');
    items.forEach(q => {
      const card = el('div', 'item-card');
      card.innerHTML = `
        <div class="item-top">
          <div>
            <div class="item-title">${escapeHtml(q.supplier_name)}${q.is_selected ? ' <span class="tag status-done">✓ נבחר</span>' : ''}</div>
            ${q.notes ? `<div class="item-desc">${escapeHtml(q.notes)}</div>` : ''}
          </div>
          ${q.price != null ? `<div class="item-amount">${fmtMoney(q.price)}</div>` : ''}
        </div>
        <div class="item-actions" style="margin-top:0.7rem;">
          ${!q.is_selected ? '<button class="icon-btn btn-select" title="בחירה כזוכה">⭐</button>' : ''}
          <button class="icon-btn btn-edit">✏️</button>
          <button class="icon-btn btn-del">🗑️</button>
        </div>
      `;
      const selectBtn = card.querySelector('.btn-select');
      if (selectBtn) selectBtn.addEventListener('click', () => selectQuote(q));
      card.querySelector('.btn-edit').addEventListener('click', () => openQuoteModal(q));
      card.querySelector('.btn-del').addEventListener('click', () => deleteQuote(q.id));
      list.appendChild(card);
    });
    group.appendChild(list);
    wrap.appendChild(group);
  });
}

async function selectQuote(q) {
  await supabase.from('quotes').update({ is_selected: false }).eq('apartment_id', state.currentApartmentId).eq('category', q.category);
  await supabase.from('quotes').update({ is_selected: true }).eq('id', q.id);
  await loadAllData(); renderCurrentView(); toast('סומן כזוכה');
}

async function deleteQuote(id) {
  if (!confirm('למחוק את ההצעה?')) return;
  const { error } = await supabase.from('quotes').delete().eq('id', id);
  if (error) { toast('שגיאה במחיקה', true); return; }
  await loadAllData(); renderCurrentView(); toast('נמחק');
}

function openQuoteModal(existing) {
  const isEdit = !!existing;
  openModal(`
    <div class="modal-title">${isEdit ? 'עריכת הצעה' : 'הצעת מחיר חדשה'}</div>
    <div class="cat-picker" id="mCatPicker"></div>
    <div class="field"><label>שם הספק</label><input type="text" id="mSupplier" value="${isEdit ? escapeHtml(existing.supplier_name) : ''}"></div>
    <div class="field"><label>מחיר (אופציונלי, ₪)</label><input type="number" id="mQuotePrice" min="0" step="1" value="${isEdit && existing.price != null ? existing.price : ''}"></div>
    <div class="field"><label>הערות (מה כלול/לא כלול, אופציונלי)</label><textarea id="mQuoteNotes" rows="2">${isEdit ? escapeHtml(existing.notes || '') : ''}</textarea></div>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-block" id="mCancel">ביטול</button>
      <button class="btn btn-gold btn-block" id="mSave">שמירה</button>
    </div>
  `);

  let selCat = existing?.category || 'general';
  renderCatPicker($('#mCatPicker'), selCat, c => selCat = c);

  $('#mCancel').addEventListener('click', closeModal);
  $('#mSave').addEventListener('click', async () => {
    const supplierName = $('#mSupplier').value.trim();
    const priceVal = $('#mQuotePrice').value;
    const price = priceVal === '' ? null : parseFloat(priceVal);
    const notes = $('#mQuoteNotes').value.trim();
    if (!supplierName) { toast('נא למלא שם ספק', true); return; }

    const payload = { apartment_id: state.currentApartmentId, category: selCat, supplier_name: supplierName, price, notes: notes || null };
    let error;
    if (isEdit) {
      ({ error } = await supabase.from('quotes').update(payload).eq('id', existing.id));
    } else {
      payload.added_by_member_id = state.member.id;
      ({ error } = await supabase.from('quotes').insert(payload));
    }
    if (error) { toast('שגיאה בשמירה', true); return; }
    closeModal();
    await loadAllData(); renderCurrentView(); toast('נשמר בהצלחה');
  });
}

// ===================== GLOBAL SEARCH =====================
function openSearchModal() {
  const modal = openModal(`
    <div class="modal-title">חיפוש</div>
    <div class="field"><input type="text" id="searchInput" placeholder="חפשו משימה, עלות, איש קשר..." autofocus></div>
    <div id="searchResults" class="list"></div>
  `);
  const input = $('#searchInput');
  input.addEventListener('input', () => renderSearchResults(input.value.trim()));
  renderSearchResults('');
  setTimeout(() => input.focus(), 50);
}

function renderSearchResults(q) {
  const wrap = $('#searchResults');
  if (!q) { wrap.innerHTML = `<div class="empty-state" style="padding:1.5rem;"><div class="em">🔍</div>הקלידו כדי לחפש בדירה הנוכחית</div>`; return; }
  const needle = q.toLowerCase();
  const results = [];

  state.tasks.filter(t => (t.title + ' ' + (t.description || '')).toLowerCase().includes(needle))
    .forEach(t => results.push({ icon: '📋', title: t.title, sub: catLabel(t.category), view: 'tasks' }));
  state.expenses.filter(e => (e.description + ' ' + (e.notes || '')).toLowerCase().includes(needle))
    .forEach(e => results.push({ icon: '💰', title: e.description, sub: fmtMoney(e.amount), view: 'costs' }));
  state.contacts.filter(c => (c.name + ' ' + (c.notes || '')).toLowerCase().includes(needle))
    .forEach(c => results.push({ icon: '📇', title: c.name, sub: contactCatLabel(c.category), view: 'contacts' }));
  state.furnitureItems.filter(f => (f.title + ' ' + (f.store || '')).toLowerCase().includes(needle))
    .forEach(f => results.push({ icon: '🛋️', title: f.title, sub: furnCatLabel(f.category), view: 'furniture' }));
  state.quotes.filter(q2 => (q2.supplier_name + ' ' + (q2.notes || '')).toLowerCase().includes(needle))
    .forEach(q2 => results.push({ icon: '📊', title: q2.supplier_name, sub: catLabel(q2.category), view: 'quotes' }));

  if (results.length === 0) { wrap.innerHTML = `<div class="empty-state" style="padding:1.5rem;"><div class="em">🔍</div>אין תוצאות</div>`; return; }
  wrap.innerHTML = '';
  results.forEach(r => {
    const item = el('div', 'item-card', `
      <div class="contact-row">
        <div class="contact-avatar">${r.icon}</div>
        <div style="flex:1;"><div class="item-title">${escapeHtml(r.title)}</div><div class="item-desc">${escapeHtml(r.sub)}</div></div>
      </div>
    `);
    item.style.cursor = 'pointer';
    item.addEventListener('click', () => { closeModal(); switchView(r.view); });
    wrap.appendChild(item);
  });
}

// ===================== SHARED UI HELPERS =====================
function renderCatPicker(container, selected, onPick, categories = CATEGORIES) {
  container.innerHTML = '';
  categories.forEach(c => {
    const item = el('div', 'cat-pick-item' + (c.id === selected ? ' active' : ''), `<span class="ic">${c.icon}</span>${c.label}`);
    item.addEventListener('click', () => {
      selected = c.id;
      container.querySelectorAll('.cat-pick-item').forEach(x => x.classList.remove('active'));
      item.classList.add('active');
      onPick(c.id);
    });
    container.appendChild(item);
  });
}
function renderStatusPicker(container, options, selected, onPick) {
  container.innerHTML = '';
  options.forEach(o => {
    const item = el('div', 'status-pick-item' + (o.id === selected ? ' active' : ''), o.label);
    item.addEventListener('click', () => {
      container.querySelectorAll('.status-pick-item').forEach(x => x.classList.remove('active'));
      item.classList.add('active');
      onPick(o.id);
    });
    container.appendChild(item);
  });
}
function openModal(innerHtml) {
  const overlay = el('div', 'modal-overlay');
  overlay.innerHTML = `<div class="modal-sheet"><div class="modal-handle"></div>${innerHtml}</div>`;
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  $('#modalRoot').appendChild(overlay);
  return overlay;
}
function closeModal() { $('#modalRoot').innerHTML = ''; }
function safeFileExt(file) {
  // Storage keys must be ASCII-safe; never build a path from the raw file name (breaks on Hebrew/emoji/etc).
  const m = /\.([a-zA-Z0-9]{1,8})$/.exec(file.name || '');
  if (m) return '.' + m[1].toLowerCase();
  const byMime = { 'image/jpeg': '.jpg', 'image/png': '.png', 'image/heic': '.heic', 'image/webp': '.webp', 'application/pdf': '.pdf' };
  return byMime[file.type] || '';
}
function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ===================== GO =====================
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
bootstrap();
</script>
